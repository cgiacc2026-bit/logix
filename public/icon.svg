<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#grad1)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />
  
  <!-- Modern Geometric ERP Monogram (L + Cube / Layers) -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Base isometric block -->
    <path d="M150 20 L270 90 L270 230 L150 300 L30 230 L30 90 Z" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M150 20 L150 160 L270 230" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round" />
    <path d="M150 160 L30 230" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Central Diamond Node -->
    <polygon points="150,110 190,135 150,160 110,135" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Typography: LOGIX -->
  <text x="256" y="440" font-family="'Cairo', system-ui, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="8">LOGIX ERP</text>
  <text x="256" y="475" font-family="'Cairo', system-ui, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">IFRS COMPLIANT</text>
</svg>
